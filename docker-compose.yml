version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: discord_postgres
    restart: always
    environment:
      POSTGRES_USER: discord_user
      POSTGRES_PASSWORD: discord_password
      POSTGRES_DB: discord_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: 